<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Aayusha Profile</title>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #eeeaf7;
        }

        .profile-card {
            width: 330px;
            background-color: #ffffff;
            text-align: center;
            margin: 60px auto;
            padding: 30px;
            border-radius: 20px;
            border: 2px solid #c8b6e2;
            box-shadow: 0px 5px 12px #cccccc;
        }

        .photo {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            object-fit: cover;
            border: 5px solid #8e7cc3;
        }

        h2 {
            color: #4b3f72;
            margin-bottom: 5px;
        }

        .address {
            color: #777777;
            font-size: 16px;
        }

        .tagline {
            color: #8e7cc3;
            font-size: 12px;
            letter-spacing: 3px;
            margin: 20px;
        }

        button {
            padding: 10px 25px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
        }

        #showButton {
            background-color: #8e7cc3;
            color: white;
        }

        #showButton:hover {
            background-color: #6f5fa7;
        }

        #qrArea {
            display: none;
            background-color: #f4f0fa;
            border: 1px solid #c8b6e2;
            margin-top: 20px;
            padding: 20px;
            border-radius: 12px;
        }

        #qrCode {
            display: flex;
            justify-content: center;
            margin: 15px;
        }

        #closeButton {
            background-color: #555555;
            color: white;
        }

        #closeButton:hover {
            background-color: #333333;
        }

    </style>

</head>

<body>

    <div class="profile-card">

        <img src="profile.png.jpg" class="photo">

        <h2>Aayusha Luitel</h2>

        <p class="address">
            📍 Baneshwor, Kathmandu
        </p>

        <p class="tagline">
            LEARN • CONNECT • GROW
        </p>

        <button id="showButton">
            Show LinkedIn QR
        </button>


        <div id="qrArea">

            <div id="qrCode"></div>

            <p>Scan to visit my LinkedIn</p>

            <button id="closeButton">
                Close
            </button>

        </div>

    </div>


    <script>

        $(document).ready(function(){

            new QRCode("qrCode", {
                text: "https://www.linkedin.com/in/aayusha-luitel-00700b326/",
                width: 140,
                height: 140
            });


            $("#showButton").click(function(){

                $("#qrArea").fadeIn();

                $("#showButton").hide();

            });


            $("#closeButton").click(function(){

                $("#qrArea").fadeOut();

                $("#showButton").show();

            });

        });

    </script>

</body>

</html>
