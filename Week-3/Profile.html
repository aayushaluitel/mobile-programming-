<!DOCTYPE html>
<html>
<head>
    <title>Aayusha Profile Card</title>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- QR Code -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7fb;
        }

        .card {
            width: 350px;
            text-align: center;
            background-color: white;
            border: 1px solid #ddd;
            border-radius: 15px;
            padding: 30px;
            margin: 50px auto;
            box-shadow: 0px 4px 15px rgba(0,0,0,0.1);
        }

        .profile-img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            border: 5px solid #b8dcff;
        }

        h2 {
            font-size: 30px;
            margin-bottom: 10px;
        }

        .location {
            font-size: 17px;
            color: #666;
        }

        .tagline {
            font-size: 12px;
            color: #667788;
            letter-spacing: 4px;
            margin: 25px 0;
        }

        button {
            border: none;
            padding: 13px 30px;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
        }

        #showQR {
            background-color: #087dde;
            color: white;
        }

        #qrSection {
            display: none;
            background-color: #eef7ff;
            padding: 20px;
            margin-top: 20px;
            border-radius: 15px;
        }

        #qrcode {
            display: flex;
            justify-content: center;
            margin-bottom: 15px;
        }

        #closeQR {
            background-color: #566273;
            color: white;
        }

    </style>
</head>

<body>

    <div class="card">

        <!-- YOUR PHOTO -->
        <img src="profile.png.jpg" class="profile-img">

        <h2>Aayusha Luitel</h2>

        <p class="location">
            📍 Baneshwor, Kathmandu
        </p>

        <p class="tagline">
            LEARN • CONNECT • GROW
        </p>

        <!-- SHOW BUTTON -->
        <button id="showQR">
            ▦ Show QR
        </button>


        <!-- QR SECTION -->
        <div id="qrSection">

            <div id="qrcode"></div>

            <p>Scan to view my LinkedIn profile</p>

            <button id="closeQR">
                ✕ Close QR
            </button>

        </div>

    </div>


    <script>

        $(document).ready(function(){

            // Create LinkedIn QR Code
            new QRCode(document.getElementById("qrcode"), {
                text: "https://www.linkedin.com/in/aayusha-luitel-00700b326/",
                width: 150,
                height: 150
            });


            // Show QR
            $("#showQR").click(function(){

                $("#qrSection").show();

                $("#showQR").hide();

            });


            // Close QR
            $("#closeQR").click(function(){

                $("#qrSection").hide();

                $("#showQR").show();

            });

        });

    </script>

</body>
</html>
